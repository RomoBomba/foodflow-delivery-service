services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${TLS_CERT_DIR:-./.local/tls}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FRONTEND_DIST:-./frontend/dist}
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - backend
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/foodflow
      DB_USERNAME: foodflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: native
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: foodflow
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d foodflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
